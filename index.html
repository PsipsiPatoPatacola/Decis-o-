
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma decisão para nós ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe1e8, #e8dfff);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  color: #4b244a;
}

.container {
  width: 90%;
  max-width: 500px;
  background: rgba(255,255,255,0.9);
  padding: 30px 22px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 10px 35px #a66c9b33;
  margin: 30px 0;
}

h1 {
  font-size: 27px;
  margin-bottom: 12px;
}

p {
  line-height: 1.6;
}

.opcao {
  display: block;
  width: 100%;
  padding: 17px;
  margin: 15px 0;
  border: none;
  border-radius: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.opcao:hover {
  transform: scale(1.03);
  box-shadow: 0 5px 15px #00000015;
}

.a {
  background: #ff8fa3;
  color: white;
}

.b {
  background: #b39ddb;
  color: white;
}

.c {
  background: #f4b6c2;
  color: #572d46;
  position: fixed;
  z-index: 10;
  width: auto;
  max-width: 80vw;
  left: 50%;
  top: 85%;
  transform: translate(-50%, -50%);
  margin: 0;
}

.c:hover {
  transform: translate(-50%, -50%);
}

#resultado {
  display: none;
  margin-top: 20px;
  padding: 20px;
  background: #fff0f5;
  border-radius: 15px;
  animation: aparecer 0.5s ease;
}

@keyframes aparecer {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

.balao {
  position: fixed;
  bottom: -100px;
  width: 40px;
  height: 55px;
  border-radius: 50%;
  animation: subir 4s linear forwards;
  z-index: 20;
  pointer-events: none;
}

.balao::after {
  content: "";
  position: absolute;
  top: 54px;
  left: 19px;
  height: 35px;
  border-left: 1px solid #999;
}

@keyframes subir {
  to {
    transform: translateY(-120vh);
    opacity: 0;
  }
}

.confete {
  position: fixed;
  top: -20px;
  width: 10px;
  height: 15px;
  animation: cair 3s linear forwards;
  z-index: 20;
  pointer-events: none;
}

@keyframes cair {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #00000066;
  z-index: 30;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-conteudo {
  background: white;
  border-radius: 20px;
  padding: 30px 20px;
  width: 100%;
  max-width: 350px;
  text-align: center;
  animation: aparecer 0.3s ease;
}

.modal-conteudo h2 {
  color: #754c8a;
}

.botoes-modal {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.botoes-modal button {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
}

.sim {
  background: #b39ddb;
  color: white;
}

.nao {
  background: #eee;
  color: #444;
}

#mensagemFinal {
  display: none;
  margin-top: 20px;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="container">
  <h1>Uma decisão para nós ❤️</h1>
  <p>Quero que você escolha com carinho o que realmente deseja para nós.</p>

  <button class="opcao a" onclick="escolherA()">
    Opção A — Continuar como estamos e fazermos planos juntos pra João Pessoa.
  </button>

  <button class="opcao b" onclick="abrirB()">
    Opção B — Eu voltar pra CG-MS.
  </button>

  <div id="resultado">
    <h2>❤️</h2>
    <p>Então vamos continuar escrevendo nossa história juntos!</p>
    <p>João Pessoa nos espera!</p>
  </div>
</div>

<button class="opcao c" id="botaoC">
  Opção C — Terminar de vez.
</button>

<div class="modal" id="modal">
  <div class="modal-conteudo">
    <h2 id="pergunta">Tem certeza?</h2>
    <p id="textoModal">Pense com carinho nessa escolha.</p>

    <div class="botoes-modal">
      <button class="sim" onclick="confirmarB()">Sim</button>
      <button class="nao" onclick="fecharB()">Não</button>
    </div>

    <p id="mensagemFinal">
      Você confirmou sua escolha. ❤️
    </p>
  </div>
</div>

<script>
let etapa = 1;
let audioContext;

function iniciarAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

function tocarNota(frequencia, duracao, volume = 0.15) {
  iniciarAudio();

  const oscilador = audioContext.createOscillator();
  const ganho = audioContext.createGain();

  oscilador.type = "sine";
  oscilador.frequency.value = frequencia;
  ganho.gain.value = volume;

  oscilador.connect(ganho);
  ganho.connect(audioContext.destination);

  oscilador.start();
  ganho.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + duracao
  );

  oscilador.stop(audioContext.currentTime + duracao);
}

function escolherA() {
  iniciarAudio();

  [523, 659, 784, 1046].forEach((nota, i) => {
    setTimeout(() => tocarNota(nota, 0.4), i * 150);
  });

  document.getElementById("resultado").style.display = "block";

  for (let i = 0; i < 18; i++) {
    criarBalao();
    criarConfete();
  }
}

function criarBalao() {
  const balao = document.createElement("div");
  balao.className = "balao";

  const cores = ["#ff6b81", "#ffd166", "#a0c4ff", "#cdb4db", "#80ed99"];

  balao.style.background = cores[Math.floor(Math.random() * cores.length)];
  balao.style.left = Math.random() * 100 + "vw";

  document.body.appendChild(balao);

  setTimeout(() => balao.remove(), 4000);
}

function criarConfete() {
  const confete = document.createElement("div");
  confete.className = "confete";

  const cores = ["#ff6b81", "#ffd166", "#a0c4ff", "#cdb4db"];

  confete.style.background = cores[Math.floor(Math.random() * cores.length)];
  confete.style.left = Math.random() * 100 + "vw";

  document.body.appendChild(confete);

  setTimeout(() => confete.remove(), 3000);
}

function abrirB() {
  iniciarAudio();

  // Piano grave e dramático
  tocarNota(130.81, 1.2, 0.25);

  document.getElementById("modal").style.display = "flex";
  document.getElementById("pergunta").textContent = "Tem certeza?";
  document.getElementById("textoModal").textContent = "Pense com carinho nessa escolha.";
  document.getElementById("mensagemFinal").style.display = "none";

  etapa = 1;
}

function confirmarB() {
  if (etapa === 1) {
    tocarNota(98, 1.2, 0.25);

    document.getElementById("pergunta").textContent =
      "Você confirma essa opção mesmo?";

    document.getElementById("textoModal").textContent =
      "Essa é realmente a sua decisão?";

    etapa = 2;
  } else {
    document.getElementById("pergunta").textContent =
      "Escolha confirmada.";

    document.getElementById("textoModal").textContent = "";

    document.querySelector(".botoes-modal").style.display = "none";

    document.getElementById("mensagemFinal").style.display = "block";
  }
}

function fecharB() {
  document.getElementById("modal").style.display = "none";
  document.querySelector(".botoes-modal").style.display = "flex";
}

const botaoC = document.getElementById("botaoC");

function fugir() {
  const largura = window.innerWidth;
  const altura = window.innerHeight;

  const larguraBotao = botaoC.offsetWidth;
  const alturaBotao = botaoC.offsetHeight;

  const margem = 10;

  const x = margem + Math.random() * (largura - larguraBotao - margem * 2);
  const y = margem + Math.random() * (altura - alturaBotao - margem * 2);

  botaoC.style.left = x + "px";
  botaoC.style.top = y + "px";
  botaoC.style.transform = "none";
}

botaoC.addEventListener("pointerdown", function(event) {
  event.preventDefault();
  fugir();
});

botaoC.addEventListener("mouseenter", fugir);

botaoC.addEventListener("click", function(event) {
  event.preventDefault();
  fugir();
});

window.addEventListener("resize", fugir);
</script>

</body>
</html>
